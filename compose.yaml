services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: tracking-plan-audit:latest
    container_name: tracking-plan-audit
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
    ports:
      # Host-side port is configurable: TRACKING_API_HOST_PORT=9090 docker compose up -d
      - "${TRACKING_API_HOST:-0.0.0.0}:${TRACKING_API_HOST_PORT:-8080}:8080"
    restart: unless-stopped
    # The HEALTHCHECK baked into the image drives the verify dependency
    # below; repeat it here so overrides stay visible.
    healthcheck:
      test: ["CMD", "python", "/srv/healthcheck.py"]
      interval: 5s
      timeout: 3s
      start_period: 3s
      retries: 5

  verify:
    image: tracking-plan-audit:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracking-plan-audit-verify
    depends_on:
      api:
        condition: service_healthy
    environment:
      SERVICE_URL: "http://api:8080"
    command: ["python", "verify.py"]
    restart: "no"
